[project]
name = "ablation-lab"
version = "0.1.0"
description = "An educational web app for transformer ablation. Users can compose tiny architectures, run real inference, see real costs, learn why."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ablation", "training", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]